# Grouped so an ecosystem's routine bumps arrive as ONE pull request instead of
# one per dependency. Ungrouped, this fleet opened 1,461 PRs across 176 repos.
#
# Majors are deliberately left OUT of the npm group. When the 2026-08-18 backlog
# was landed by hand, 109 bumps had to be held back and they were overwhelmingly
# majors. Grouping a breaking major together with the safe bumps makes the whole
# PR unmergeable, so majors come individually and a human decides.
#
# github-actions majors ARE grouped: checkout v4->v7, setup-node v4->v7 and the
# Pages v5/v6 jumps were verified green across all 176 repos on 2026-08-18.
#
# The minor/patch group and the actions group auto-merge once this lab's own gate
# passes on the PR -- see the dependabot-auto-merge job in the deploy workflow.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    # Playwright is PINNED TO THE CI CONTAINER, so it must not move on its own.
    # The gate runs in mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    # and package.json pins @playwright/test to 1.65.1 to match that image's
    # bundled browsers. A Dependabot bump of the npm package alone leaves the
    # container one version behind the test runner, which is a mismatch the gate
    # cannot report as such. Playwright moves only in a deliberate change that
    # bumps the image tag (v1.65.1), its @sha256 digest and this pin together.
    #
    # @axe-core/playwright is deliberately NOT ignored: it tracks axe-core, not the
    # browser build, and nothing about it is pinned to the image.
    ignore:
      - dependency-name: "@playwright/test"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
